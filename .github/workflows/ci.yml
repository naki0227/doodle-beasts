name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.6-stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Unit tests
        run: ~/godot/godot --headless --path . -s res://tests/run_tests.gd

      - name: Simulation (waves reach the core)
        run: ~/godot/godot --headless --path . -s res://tests/simulate.gd

      - name: Main scene boots without script errors
        run: |
          ~/godot/godot --headless --path . --quit-after 300 2>&1 | tee boot.log
          ! grep -E "SCRIPT ERROR|ERROR:" boot.log
